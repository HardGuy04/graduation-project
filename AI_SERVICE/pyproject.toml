[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.0.1"
description = "Clinical Decision Support System (CDSS) for Disease and Drug Recommendation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.0",
    "scikit-learn>=1.9.0",
    "numpy>=2.5.0",
    "scipy>=1.18.0",
    "joblib>=1.6.0",
    "rapidfuzz>=3.14.0",
    "python-dotenv>=1.2.0",
    "pandas>=3.0.0",
    "pyyaml>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["drug_recommendation", "chatbot", "scripts"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/fixtures",
    "reports/tmp",
    ".venv",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
